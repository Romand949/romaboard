name: Build APK
on:
  push:
    branches: [main, master]
    paths: ['*.zip', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak zip terbaru
        run: |
          Z=$(ls *.zip 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$Z" ]; then echo "Tidak ada file .zip di root repo"; exit 1; fi
          echo "Memakai: $Z"
          unzip -o "./$Z" -x '.github/*'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AIKeyboard-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Buat Release (untuk Cek update di app)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AI Keyboard build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
